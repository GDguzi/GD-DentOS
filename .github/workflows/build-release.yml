name: build-release

# 一键包自动构建：打 v* 标签自动出 Windows exe + macOS 包，挂到 GitHub Release
# 并同步到 Gitee 发行版；也可在 Actions 页手动触发（手动触发只构建、不发布）。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 打标签时创建 Release 需要;默认令牌只读会报 Resource not accessible

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包一键 exe
        run: pyinstaller packaging/windows/good-dental.spec --distpath dist --workpath build --clean --noconfirm

      - name: 冒烟——启动 exe、健康检查、登录页 200
        shell: pwsh
        run: |
          $env:DENTAL_PORT = "8891"
          # onefile 首启要解压+建库+迁移,慢机器实测可超 3 分钟 → 等 300 秒;失败时打印 exe 输出定位
          $p = Start-Process "dist/good-dental-clinic.exe" -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput exe_stdout.log -RedirectStandardError exe_stderr.log
          try {
            $ok = $false
            for ($i = 0; $i -lt 300; $i++) {
              if ($p.HasExited) { break }
              try {
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8891/api/health" -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep 1 }
            }
            if (-not $ok) {
              Get-Content exe_stdout.log, exe_stderr.log -ErrorAction SilentlyContinue |
                Select-String -NotMatch "已建管理员" | Write-Host
              if ($p.HasExited) { throw "exe 启动后自行退出(exit $($p.ExitCode)),输出见上" }
              throw "exe 启动后健康检查 300 秒未就绪,输出见上"
            }
            $login = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8891/" -TimeoutSec 5
            if ($login.StatusCode -ne 200) { throw "登录页返回 $($login.StatusCode)" }
            Write-Host "smoke ok: health 200 / login page 200"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 打包 zip
        shell: pwsh
        run: Compress-Archive -Path dist/good-dental-clinic.exe -DestinationPath dist/good-dental-clinic-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: |
            dist/good-dental-clinic.exe
            dist/good-dental-clinic-windows.zip

  macos:
    # macos-latest 是 Apple 芯片(arm64)机器，产物只适用于 M 系列 Mac；
    # 老款 Intel Mac 走源码方式（README 快速开始）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          # 必须带 requirements-ocr.txt：拍照建档走苹果 Vision，靠 pyobjc 桥接。
          # 源码方式跑一般不用装(系统自带 /usr/bin/python3 预装了 pyobjc)，但这里是
          # setup-python 装的独立解释器,冻结后借不到系统 PyObjC —— 漏了这行,发出去的
          # Mac 包 /api/ocr/status 就是 available:false,拍照建档入口整个隐藏。
          # 本机实测:装了即 available:true(engine=macos-vision),现有 spec 无需加 hiddenimports。
          pip install -r requirements.txt -r requirements-ocr.txt pyinstaller

      - name: 打包一键包
        run: pyinstaller packaging/macos/good-dental-mac.spec --distpath dist --workpath build --clean --noconfirm

      - name: 冒烟——启动、健康检查、登录页 200、拍照建档可用
        run: |
          set -euo pipefail
          mkdir -p smoke && cp dist/good-dental-clinic smoke/
          cd smoke
          # BROWSER=/usr/bin/true：CI 无桌面，别让 webbrowser.open 卡住
          BROWSER=/usr/bin/true DENTAL_PORT=8892 ./good-dental-clinic > out.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 300); do
            kill -0 $pid 2>/dev/null || break
            if curl -sf -o /dev/null http://127.0.0.1:8892/api/health; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then grep -v "已建管理员" out.log || true; kill $pid 2>/dev/null || true; exit 1; fi
          curl -sf -o /dev/null http://127.0.0.1:8892/ || { kill $pid 2>/dev/null || true; exit 1; }
          # 拍照建档：/api/ocr/status 要登录才给看，用出厂默认口令 admin 登一下。
          # 不断言这条，OCR 依赖漏装时包照样打得出来、冒烟照样绿，只有用户下载后才发现入口没了。
          pw="admin"
          curl -sf -c jar.txt -X POST http://127.0.0.1:8892/api/auth/login \
            -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$pw\"}" -o /dev/null \
            || { echo "冒烟登录失败"; kill $pid 2>/dev/null || true; exit 1; }
          ocr="$(curl -sf -b jar.txt http://127.0.0.1:8892/api/ocr/status)"
          echo "ocr status: $ocr"
          case "$ocr" in
            *'"available":true'*) : ;;
            *) echo "❌ 拍照建档不可用——多半是漏装 requirements-ocr.txt(pyobjc)"; kill $pid 2>/dev/null || true; exit 1;;
          esac
          echo "smoke ok: health 200 / login page 200 / ocr available"
          kill $pid 2>/dev/null || true

      - name: 打包 zip（改名 .command 才能双击启动）
        run: |
          set -euo pipefail
          cp dist/good-dental-clinic dist/good-dental-clinic.command
          chmod +x dist/good-dental-clinic.command
          cd dist && zip -q good-dental-clinic-mac.zip good-dental-clinic.command

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: dist/good-dental-clinic-mac.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest   # 中文文件名在 Linux 上收发正常，Windows runner 的 curl 读不了
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: 收拢产物 + 现转 Word 说明书
        run: |
          set -euo pipefail
          mkdir -p dist && find art -type f -exec mv {} dist/ \;
          command -v pandoc >/dev/null || sudo apt-get install -y -qq pandoc
          pandoc docs/产品手册.md -o dist/产品手册.docx
          pandoc docs/常见问题解答.md -o dist/常见问题解答.docx
          pandoc README.md -o dist/使用说明.docx
          ls -lh dist

      # Release 说明 = 更新日志.md 里本版小节；缺小节直接红，逼着每版都写更新内容。
      - name: 提取本版更新说明
        run: |
          set -euo pipefail
          awk -v tag="${GITHUB_REF_NAME}" '$0 ~ "^## "tag" " {f=1; next} /^## v/ {f=0} f' 更新日志.md > release_body.md
          if [ ! -s release_body.md ]; then echo "❌ 更新日志.md 缺少 ${GITHUB_REF_NAME} 小节，先补更新内容再发版"; exit 1; fi
          cat release_body.md

      # GitHub 附件名不能用中文——action 会改名成 default.docx 并报 404（v0.1.2 踩过）。
      # Word 版只挂 Gitee，GitHub 侧受众看 markdown 即可。
      - name: 挂到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            dist/good-dental-clinic.exe
            dist/good-dental-clinic-windows.zip
            dist/good-dental-clinic-mac.zip

      # 同一批产物同步到 Gitee 发行版（国内用户打不开 GitHub）。
      # 需在仓库 Secrets 配 GITEE_TOKEN（Gitee 个人设置 → 私人令牌，勾 projects 权限）；没配则跳过。
      - name: 同步到 Gitee 发行版
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: gubaoye/GD-DentOS
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then echo "未配置 GITEE_TOKEN，跳过 Gitee 同步"; exit 0; fi
          API="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          jget() { python3 -c "import json,sys;d=json.load(sys.stdin);print(d$1 if d else '')"; }
          id=$(curl -sf "${API}/releases/tags/${GITHUB_REF_NAME}?access_token=${GITEE_TOKEN}" | jget "['id']" || true)
          if [ -z "${id}" ]; then
            body="$(cat release_body.md)

          Windows / macOS 一键版，下载即用。安装见 docs/产品手册.md。"
            id=$(curl -sf -X POST "${API}/releases" \
              -F "access_token=${GITEE_TOKEN}" -F "tag_name=${GITHUB_REF_NAME}" \
              -F "name=${GITHUB_REF_NAME}" -F "body=${body}" \
              -F "target_commitish=main" \
              | jget "['id']") || { echo "Gitee 建发行版失败——先把标签推到 Gitee：git push <gitee远程> ${GITHUB_REF_NAME}"; exit 1; }
          fi
          # 已存在同名附件就跳过，避免重跑挂出两份
          have=$(curl -sf "${API}/releases/${id}/attach_files?access_token=${GITEE_TOKEN}" \
                 | python3 -c "import json,sys;print(' '.join(a['name'] for a in json.load(sys.stdin)))")
          for f in dist/good-dental-clinic.exe dist/good-dental-clinic-windows.zip dist/good-dental-clinic-mac.zip \
                   dist/产品手册.docx dist/常见问题解答.docx dist/使用说明.docx; do
            n=$(basename "$f")
            case " ${have} " in *" ${n} "*) echo "Gitee 已有 ${n}，跳过"; continue;; esac
            curl -sf -X POST "${API}/releases/${id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" -F "file=@${f}" -o /dev/null
            echo "已上传到 Gitee：${n}"
          done
