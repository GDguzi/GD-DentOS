# Windows 全量测试:手动触发,在 windows-latest 跑 test/ 全部单元测试(源码直跑,不打包)
name: windows-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 全量单元测试
        run: python -m unittest discover -s test -q
