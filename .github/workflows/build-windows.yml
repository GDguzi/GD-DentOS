name: build-windows-exe

# Windows 一键 exe 自动构建：打 v* 标签自动构建并挂到 Release；也可在 Actions 页手动触发。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 打标签时创建 Release 需要;默认令牌只读会报 Resource not accessible

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包一键 exe
        run: pyinstaller packaging/windows/good-dental.spec --distpath dist --workpath build --clean --noconfirm

      - name: 冒烟——启动 exe、健康检查、登录页 200
        shell: pwsh
        run: |
          $env:DENTAL_PORT = "8891"
          # onefile 首启要解压+建库+迁移,慢机器实测可超 3 分钟 → 等 300 秒;失败时打印 exe 输出定位
          $p = Start-Process "dist/good-dental-clinic.exe" -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput exe_stdout.log -RedirectStandardError exe_stderr.log
          try {
            $ok = $false
            for ($i = 0; $i -lt 300; $i++) {
              if ($p.HasExited) { break }
              try {
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8891/api/health" -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep 1 }
            }
            if (-not $ok) {
              Get-Content exe_stdout.log, exe_stderr.log -ErrorAction SilentlyContinue |
                Select-String -NotMatch "已建管理员" | Write-Host
              if ($p.HasExited) { throw "exe 启动后自行退出(exit $($p.ExitCode)),输出见上" }
              throw "exe 启动后健康检查 300 秒未就绪,输出见上"
            }
            $login = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8891/" -TimeoutSec 5
            if ($login.StatusCode -ne 200) { throw "登录页返回 $($login.StatusCode)" }
            Write-Host "smoke ok: health 200 / login page 200"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 打包 zip
        shell: pwsh
        run: Compress-Archive -Path dist/good-dental-clinic.exe -DestinationPath dist/good-dental-clinic-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: good-dental-windows
          path: |
            dist/good-dental-clinic.exe
            dist/good-dental-clinic-windows.zip

      # Word 版说明书由同名 markdown 现转，保证随包发出的永远是最新内容
      - name: 生成 Word 版说明书
        shell: bash
        run: |
          set -euo pipefail
          pandoc=$(command -v pandoc || true)
          if [ -z "${pandoc}" ]; then
            choco install pandoc -y --no-progress >/dev/null
            pandoc="/c/Program Files/Pandoc/pandoc.exe"
          fi
          "${pandoc}" docs/产品手册.md -o dist/产品手册.docx
          "${pandoc}" docs/常见问题解答.md -o dist/常见问题解答.docx
          "${pandoc}" README.md -o dist/使用说明.docx

      - name: 打标签时挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/good-dental-clinic.exe
            dist/good-dental-clinic-windows.zip
            dist/产品手册.docx
            dist/常见问题解答.docx
            dist/使用说明.docx

      # 同一份 exe 同步一份到 Gitee 发行版（国内用户打不开 GitHub）。
      # 需在仓库 Secrets 配 GITEE_TOKEN（Gitee 个人设置 → 私人令牌，勾 projects 权限）；没配则跳过。
      - name: 同步安装包与说明书到 Gitee 发行版
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: gubaoye/GD-DentOS
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then echo "未配置 GITEE_TOKEN，跳过 Gitee 同步"; exit 0; fi
          API="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          jget() { python -c "import json,sys;print(json.load(sys.stdin)$1)"; }
          id=$(curl -sf "${API}/releases/tags/${GITHUB_REF_NAME}?access_token=${GITEE_TOKEN}" | jget "['id']" || true)
          if [ -z "${id}" ]; then
            id=$(curl -sf -X POST "${API}/releases" \
              -F "access_token=${GITEE_TOKEN}" -F "tag_name=${GITHUB_REF_NAME}" \
              -F "name=${GITHUB_REF_NAME}" -F "body=Windows 一键版，下载 exe 双击即用。安装见 docs/产品手册.md。" \
              | jget "['id']") || { echo "Gitee 建发行版失败——先把标签推到 Gitee：git push <gitee远程> ${GITHUB_REF_NAME}"; exit 1; }
          fi
          # 已存在同名附件就跳过，避免重跑挂出两份
          have=$(curl -sf "${API}/releases/${id}/attach_files?access_token=${GITEE_TOKEN}" \
                 | python -c "import json,sys;print(' '.join(a['name'] for a in json.load(sys.stdin)))")
          for f in dist/good-dental-clinic.exe dist/good-dental-clinic-windows.zip \
                   dist/产品手册.docx dist/常见问题解答.docx dist/使用说明.docx; do
            n=$(basename "$f")
            case " ${have} " in *" ${n} "*) echo "Gitee 已有 ${n}，跳过"; continue;; esac
            curl -sf -X POST "${API}/releases/${id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" -F "file=@${f}" -o /dev/null
            echo "已上传到 Gitee：${n}"
          done
